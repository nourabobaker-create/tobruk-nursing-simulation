<script id="presentation-data" type="application/json">{"period":"2026–2030","roles":[{"id":"teaching_assistant","label_ar":"المعيدون ومساعدو التدريس","label_en":"Teaching assistants"},{"id":"student","label_ar":"الطلبة","label_en":"Students"},{"id":"faculty","label_ar":"أعضاء هيئة التدريس","label_en":"Teaching staff"},{"id":"employee","label_ar":"الموظفون","label_en":"Employees"},{"id":"employer","label_ar":"جهات العمل","label_en":"Employers"},{"id":"training_site","label_ar":"جهات ومواقع التدريب","label_en":"Training providers and placement sites"}],"screens":[{"id":"ST01","title_ar":"خطة 2026–2030: ما الذي نريد تحسينه؟","title_en":"The 2026–2030 plan: what do we want to improve?","lead_ar":"تعلم أفضل، وتدريب أكثر فائدة، وخدمة أنفع للمجتمع. نحتاج رأيك لتحديد ما يستحق الأولوية.","lead_en":"Better learning, more useful training and greater benefit to the community. Your experience can help us choose priorities.","bullets_ar":["توجه الخطة عمل الكلية خلال الفترة 2026–2030، وتنفذ تدريجيًا وفق القدرة والموارد المتاحة.","هذا عرض للمشاركة والمراجعة، وليس إعلانًا بأن المقترحات اعتمدت أو أن نتائجها تحققت.","بعد العرض، أجب عن أسئلة قصيرة تخص خبرتك. يمكنك اختيار «لا يمكنني الحكم» عندما لا تعرف موضوعًا."],"bullets_en":["The plan guides the faculty during 2026–2030. Work will proceed gradually, according to available capacity and resources.","This is a consultation and review version. It does not mean that the proposals have been approved or their results achieved.","After the presentation, answer a short set of questions about your experience. Choose “I cannot judge” when you do not know enough about a topic."],"axis_ids":[],"initiative_ids":[]},{"id":"ST02","title_ar":"وجهتنا: تعليم تمريضي يرتبط بالمريض والمجتمع","title_en":"Our direction: nursing education connected to patients and the community","lead_ar":"الرؤية والرسالة التاليتان من مسودة الخطة؛ يعرضان هنا لفهم التوجه العام.","lead_en":"The following vision and mission come from the draft plan. They explain its overall direction.","bullets_ar":["برنامج واحد في التمريض العام يجمع المعرفة والمهارات والسلوك المهني.","توجهنا المهنية وسلامة المريض والمسؤولية المجتمعية والواقعية والعمل المشترك."],"bullets_en":["One General Nursing programme brings together knowledge, skills and professional behaviour.","Professionalism, patient safety, community responsibility, realistic action and teamwork guide our work."],"axis_ids":[],"initiative_ids":[],"vision_ar":"أن تكون كلية التمريض – جامعة طبرق مؤسسة تعليمية ومجتمعية فاعلة في إعداد كوادر تمريضية مؤهلة، وفي تعزيز الوعي الصحي والسلوك المجتمعي الإيجابي، بما يسهم في تحسين الرعاية الصحية وخدمة احتياجات المجتمع المحلي.","vision_en":"To be an active educational and community institution that prepares qualified nursing staff and promotes health awareness and positive community behaviour, contributing to better healthcare and meeting local community needs.","mission_ar":"تلتزم كلية التمريض – جامعة طبرق بإعداد خريجين مؤهلين في التمريض العام، يمتلكون المعرفة العلمية والمهارات السريرية والسلوك المهني اللازم لخدمة المريض والمجتمع، من خلال تعليم واقعي، وتدريب سريري منظم، وبحوث ومشاريع تخرج مرتبطة بقضايا صحية محلية، وأنشطة مجتمعية تسهم في نشر الوعي الصحي وتحسين السلوك المجتمعي، بالشراكة مع مؤسسات الصحة والمجتمع.","mission_en":"The Faculty of Nursing at Tobruk University is committed to preparing qualified General Nursing graduates with the scientific knowledge, clinical skills and professional behaviour needed to serve patients and the community. It does so through realistic teaching, organised clinical training, research and graduation projects connected to local health issues, and community activities that promote health awareness and positive behaviour, in partnership with health and community organisations."},{"id":"ST03","title_ar":"1. التعليم والتعلم ونجاح الطلبة","title_en":"1. Teaching, learning and student success","lead_ar":"نريد أن يتعلم الطلبة ويتقدموا أكاديميًا، مع دعم مناسب في جميع السنوات.","lead_en":"We want students in all years to learn and make academic progress, with suitable support.","bullets_ar":["تستكمل المراجعة التخصصية للتوصيفات المعدة، وتراجع طرائق التدريس والتقويم، وتستخدم تقارير المقررات لتحسين التعلم.","وحدة الإرشاد الأكاديمي قائمة، ويستهدف الدعم الطلبة في جميع السنوات بحسب حاجتهم.","الخطوة التالية: تقديم دعم فعلي ومتابعته. مثال: مورد واضح أو إرشاد أو طريقة مراجعة مناسبة لصعوبة محددة."],"bullets_en":["Specialist review of the prepared course specifications remains to be completed. Teaching and assessment are reviewed, and course reports inform improvements.","The academic advising unit is established. Support is intended for students in all years, according to their needs.","The next step is to provide support and follow it up. Examples include a clear learning resource, guidance or a study method suited to a specific difficulty."],"axis_ids":["1"],"initiative_ids":["S1.1","S1.2","S1.3","S1.4"]},{"id":"ST04","title_ar":"2. التدريب السريري وجاهزية الخريج","title_en":"2. Clinical training and graduate readiness","lead_ar":"نريد خبرات تدريبية منظمة وأداءً آمنًا يمكن ملاحظته وتقويمه.","lead_en":"We want organised clinical experience and safe performance that can be observed and assessed.","bullets_ar":["تحسين توزيع الخبرات والإشراف والتقييم بالتعاون مع جهات التدريب.","استخدام ملاحظات الطلبة والمشرفين والخريجين لتحديد المهارات التي تحتاج تقوية.","المحاكاة الرقمية مورد مساعد قائم؛ تراجع وتجرب وتقيم فائدته قبل التوسع، ولا تعوض تلقائيًا التدريب المطلوب."],"bullets_en":["Improve the organisation of experience, supervision and assessment with training providers.","Use feedback from students, supervisors and graduates to identify skills needing further support.","Existing digital simulation is a supporting resource. Its content and value should be reviewed and tested before expansion; it does not automatically replace required clinical training."],"axis_ids":["2"],"initiative_ids":["S2.1","S2.2","S2.3","S2.4"]},{"id":"ST05","title_ar":"3. بحث محلي جيد يمكن الاستفادة منه","title_en":"3. Good local research that can be used","lead_ar":"نريد بحوثًا ومشروعات تخرج ترتبط بحاجة فعلية وتنتج معرفة مفيدة.","lead_en":"We want research and graduation projects connected to real needs, producing useful knowledge.","bullets_ar":["اختيار موضوعات صحية وتمريضية محلية يمكن دراستها بالقدرات المتاحة.","مراجعة المنهج والأخلاقيات والتحليل، وتنظيم ملفات البحوث وتطوير المهارات البحثية.","متابعة استخدام نتيجة مختارة في التعليم أو التدريب أو خدمة المجتمع؛ لا يكفي عدد البحوث أو إرسالها."],"bullets_en":["Choose local health and nursing topics that can be studied with available capacity.","Review methods, ethics and analysis, organise research files and strengthen research skills.","Follow up the use of a selected finding in education, training or community work. Counting or sending research is not enough."],"axis_ids":["3"],"initiative_ids":["S3.1","S3.2","S3.3","S3.4"]},{"id":"ST06","title_ar":"4. خدمة مجتمع وشراكات ذات فائدة","title_en":"4. Useful community work and partnerships","lead_ar":"نريد نشاطًا يستجيب لحاجة واضحة، وشراكة تنتج فائدة يمكن متابعتها.","lead_en":"We want activities responding to clear needs, and partnerships producing benefits we can follow up.","bullets_ar":["اختيار تدخل محدود مع المستفيدين والشركاء، مثل تقوية معرفة أو مهارة أو سلوك صحي معين.","تفعيل اتفاقيات مختارة بناتج عملي ومساهمة مؤكدة لكل طرف.","الاستفادة من صوت الطلبة والخريجين والمجتمع؛ ومتابعة النتيجة المناسبة بدل الاكتفاء بالحضور والصور."],"bullets_en":["Choose a focused activity with beneficiaries and partners, such as improving a specific health knowledge area, skill or behaviour.","Activate selected agreements with a practical output and a confirmed contribution from each partner.","Listen to students, graduates and the community, and follow up a suitable result rather than relying only on attendance or photographs."],"axis_ids":["4"],"initiative_ids":["S4.1","S4.2","S4.3","S4.4"]},{"id":"ST07","title_ar":"5. قدرات ومصادر وبيئة تساعد على التعلم","title_en":"5. People, resources and a supportive learning environment","lead_ar":"نريد استخدام قدرات العاملين والموارد الموجودة جيدًا، ثم تحسين الفجوات بحسب الأولوية.","lead_en":"We want to use staff capabilities and existing resources well, then address gaps by priority.","bullets_ar":["تطوير مهارات العاملين وتوزيع العمل وفق الاختصاص والتفرغ والوقت المتاح.","البوابة والمكتبة والمصادر الرقمية مطورة وقائمة؛ تراجع الجودة والتغطية وسهولة الوصول وفائدة الاستخدام.","الكلية تحدد احتياجات المرافق والمعامل والتقنية وترفعها وتتابعها. الصرف والصيانة وتوفير الموارد مسؤولية الجامعة بحسب الدعم المتاح من الوزارة."],"bullets_en":["Develop staff skills and allocate work according to expertise, availability and workload.","The portal, library and digital resources have been developed. Their quality, coverage, accessibility and usefulness still need review.","The faculty identifies facility, laboratory and technology needs, submits requests and follows them up. Spending, maintenance and resource provision are University responsibilities, subject to available Ministry support."],"axis_ids":["5"],"initiative_ids":["S5.1","S5.2","S5.3","S5.4","S5.5"]},{"id":"ST08","title_ar":"6. عمل مؤسسي واضح ومستمر","title_en":"6. Clear, reliable and continuous institutional work","lead_ar":"نريد خدمة تستمر وقرارًا يستند إلى معلومات مفيدة، مع تقليل تكرار العمل.","lead_en":"We want services to continue and decisions to use useful information, while reducing duplicated work.","bullets_ar":["وضوح المسؤوليات، وربط الخطة بسجلات العمل والتقارير القائمة.","حفظ الوثائق والبيانات بطريقة منظمة وآمنة، وتسهيل الاسترجاع والتسليم عند تغير العاملين.","اختبار بدائل مناسبة عند التعطل، ثم مراجعة ما نفع وما يحتاج تعديلًا أو توقفًا."],"bullets_en":["Keep responsibilities clear and connect the plan to existing work records and reports.","Keep documents and data organised and protected, making retrieval and handover easier when staff change.","Test suitable alternatives during disruption, then review what helps and what should be changed or stopped."],"axis_ids":["6"],"initiative_ids":["S6.1","S6.2","S6.3","S6.4","S6.5","S6.6","S6.7","S6.8"]},{"id":"ST09","title_ar":"كيف سيؤثر رأيك؟","title_en":"How will your feedback help?","lead_ar":"نبحث عن أولويات واضحة وعوائق حقيقية ومساهمة ممكنة، لا عن الموافقة على كل شيء.","lead_en":"We are looking for clear priorities, real obstacles and feasible contributions—not agreement with everything.","bullets_ar":["تساعد الإجابات على اختيار ما يبدأ أولًا، وتعديل المقترحات، وتحديد ما يحتاج دعمًا من خارج الكلية.","أجب من واقع خبرتك، واختر الأولوية الأهم لك. يمكنك عدم الاتفاق أو عدم القدرة على الحكم.","المساهمة المقترحة اختيارية وتعتمد على الوقت والاختصاص والترتيبات المتفق عليها؛ ليست وعدًا بالتمويل أو تكليفًا."],"bullets_en":["Responses can help choose what starts first, improve proposals and identify needs requiring support outside the faculty.","Answer from your experience and choose the priority most important to you. You may disagree or say you cannot judge.","A suggested contribution is voluntary and depends on time, expertise and agreed arrangements. It is not a funding promise or an assignment."],"axis_ids":[],"initiative_ids":[],"role_contributions":[{"role_id":"student","example_ar":"وصف صعوبة تعلم فعلية أو تجربة مورد قائم وإبداء رأي محدد.","example_en":"Describe a real learning difficulty or try an existing resource and give specific feedback."},{"role_id":"teaching_assistant","example_ar":"اقتراح مساعدة محدودة ضمن الاختصاص والتكليف والوقت المتاح.","example_en":"Suggest limited support within your expertise, authorised role and available time."},{"role_id":"faculty","example_ar":"تحديد تغيير صغير في التعلم أو التقويم أو مورد يحتاج مراجعة.","example_en":"Identify a small teaching or assessment change, or a resource needing review."},{"role_id":"employee","example_ar":"تحديد خطوة متكررة أو خدمة يمكن تبسيطها من العمل القائم.","example_en":"Identify a repeated step or service that could be simplified using existing work."},{"role_id":"employer","example_ar":"توضيح مهارة مطلوبة أو ملاحظة عامة من واقع أداء ا <script>
(() => {
'use strict';
const DATA=JSON.parse(document.getElementById('presentation-data').textContent);
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const escape=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const params=new URLSearchParams(location.search);
const state={lang:params.get('lang')==='en'?'en':'ar',index:Math.max(0,DATA.screens.findIndex(s=>s.id===location.hash.slice(1)))};
const f=(obj,key)=>obj?.[key+'_'+state.lang]||'';
const T={ar:{faculty:'كلية التمريض',university:'جامعة طبرق',consultation:'عرض للمشاركة والمراجعة · 2026–2030',contents:'تعرّف على الخطة',navNote:'خبرتك تساعد على تحديد الأولويات، وتحسين المقترحات، واختيار ما يمكن تنفيذه.',previous:'السابق',next:'التالي',restart:'من البداية',page:'الصفحة',of:'من',draft:'نسخة للمشاركة والمراجعة',allAxes:'ستة محاور مترابطة',visualNote:'خطة تدريجية تجمع التعلم والممارسة والبحث والخدمة والموارد والعمل المؤسسي.',vision:'الرؤية',mission:'الرسالة',expand:'اقرأ النص الكامل للرؤية والرسالة',expandHint:'من مسودة الخطة',outcome:'ما نريد أن يتحسن',axisCaptions:['تعلم الطلبة وتقدمهم الأكاديمي عبر جميع السنوات.','تعلم سريري منظم وأداء آمن يمكن ملاحظته.','معرفة محلية جيدة يمكن استخدامها.','نشاط وشراكة يعالجان حاجة فعلية.','قدرات وموارد قائمة تستخدم بصورة أفضل.','خدمات أوضح وعمل مؤسسي يستمر.'],feedbackTitle:'الآن، شاركنا رأيك',feedbackText:'اختر الصفة الأقرب إلى خبرتك، وأجب عن الأسئلة التي تخصك. يمكنك إبداء اعتراض أو اختيار «لا يمكنني الحكم».',survey:'افتح الاستبانة وشارك برأيك',roleHeading:'كيف يمكن أن تسهم خبرتك؟',printLabel:'طباعة العرض',menuLabel:'فهرس العرض',skip:'انتقل إلى المحتوى',notReady:'سيضاف رابط الاستبانة عند اكتمال تجهيزها.',coverNav:'لماذا هذه الخطة؟',identityNav:'الرؤية والرسالة',feedbackNav:'شاركنا رأيك',axesNav:['التعليم والتعلم','التدريب السريري','البحث المحلي','المجتمع والشراكات','القدرات والموارد','العمل المؤسسي'],printStatus:'عرض للمشاورة · كلية التمريض — جامعة طبرق'},en:{faculty:'Faculty of Nursing',university:'Tobruk University',consultation:'Consultation and review · 2026–2030',contents:'Explore the plan',navNote:'Your experience helps identify priorities, improve proposals and choose feasible action.',previous:'Previous',next:'Next',restart:'Start again',page:'Page',of:'of',draft:'Consultation and review version',allAxes:'Six connected directions',visualNote:'A gradual plan connecting learning, practice, research, community work, resources and institutional continuity.',vision:'Vision',mission:'Mission',expand:'Read the full vision and mission',expandHint:'From the draft plan',outcome:'What we want to improve',axisCaptions:['Learning and academic progress across all years.','Organised clinical learning and observable safe practice.','Good local knowledge that can be used.','Activities and partnerships addressing real needs.','Better use of existing capabilities and resources.','Clearer services and institutional work that continues.'],feedbackTitle:'Now, share your perspective',feedbackText:'Choose the role closest to your experience and answer the questions relevant to you. You may disagree or choose “I cannot judge”.',survey:'Open the survey and share your feedback',roleHeading:'How can your experience contribute?',printLabel:'Print the presentation',menuLabel:'Presentation contents',skip:'Skip to content',notReady:'The survey link will be added when the form is ready.',coverNav:'Why this plan?',identityNav:'Vision and mission',feedbackNav:'Share your feedback',axesNav:['Teaching and learning','Clinical training','Local research','Community partnerships','People and resources','Institutional continuity'],printStatus:'Consultation presentation · Faculty of Nursing — Tobruk University'}};
const t=k=>T[state.lang][k];
const paths={learning:'M4 4h7v16H4zM13 4h7v16h-7M7 8h2M15 8h2M7 12h2M15 12h2',clinical:'M8 3v6a4 4 0 0 0 8 0V3M5 3h4M15 3h4M12 13v3a4 4 0 0 0 8 0v-2M20 10a2 2 0 1 0 0 4 2 2 0 0 0 0-4',research:'M9 3h6M10 3v6l-6 10a1.5 1.5 0 0 0 1.3 2h13.4a1.5 1.5 0 0 0 1.3-2L14 9V3M7 15h10M10 17h.01',community:'M12 20s-8-5-8-11a4.5 4.5 0 0 1 8-2 4.5 4.5 0 0 1 8 2c0 6-8 11-8 11z',resources:'M3 21V8l9-5 9 5v13M8 21v-7h8v7M7 9h.01M12 9h.01M17 9h.01',continuity:'M8 4h12v16H4V8M4 8h4V4M8 12h8M8 16h8',arrow:'m15 5-7 7 7 7',back:'m9 5 7 7-7 7',external:'M14 3h7v7M10 14 21 3M21 14v7H3V3h7'};
const icon=(name,cls='')=>`<svg viewBox="0 0 24 24" aria-hidden="true" class="${cls}"><path d="${paths[name]||paths.learning}"/></svg>`;
const axisIcons=['learning','clinical','research','community','resources','continuity'];
const navTitle=i=>i===0?t('coverNav'):i===1?t('identityNav'):i===8?t('feedbackNav'):T[state.lang].axesNav[i-2];
const bullets=(s,cls='')=>`<div class="bullet-list ${cls}">${f(s,'bullets').map((b,i)=>`<div class="bullet"><span class="bullet-num">${String(i+1).padStart(2,'0')}</span><p>${escape(b)}</p></div>`).join('')}</div>`;
const printHead=()=>`<div class="print-head"><span class="print-brand"><img src="assets/faculty-nursing.png" alt=""><span>${t('faculty')} · ${t('university')}</span></span><span>2026–2030</span></div>`;
const printFoot=i=>`<div class="print-foot"><span>${t('printStatus')}</span><span>${i+1} / 9</span></div>`;
function cover(s){return `<div class="cover-grid"><div class="cover-copy"><span class="consultation-tag">${t('draft')}</span><p class="period" style="margin-top:19px">2026 — 2030</p><h1>${escape(f(s,'title'))}</h1><p class="lead">${escape(f(s,'lead'))}</p></div><div class="cover-visual"><div class="visual-orbit"></div><div class="visual-header"><strong>${t('allAxes')}</strong><img src="assets/tobruk-university.png" alt="${t('university')}"></div><div class="axis-chips">${T[state.lang].axesNav.map((label,i)=>`<span class="axis-chip">${icon(axisIcons[i])}${escape(label)}</span>`).join('')}</div><p class="visual-foot">${t('visualNote')}</p></div></div>${bullets(s,'cover-bullets')}`}
function identity(s){return `<p class="screen-kicker">${t('identityNav')}</p><h1>${escape(f(s,'title'))}</h1><p class="lead">${escape(f(s,'lead'))}</p><div class="identity-intro">${f(s,'bullets').map((b,i)=>`<div class="identity-theme">${icon(i?'community':'learning')}<p>${escape(b)}</p></div>`).join('')}</div><details class="full-text"><summary>${t('expand')}<span>${t('expandHint')}</span></summary><div class="identity-text"><section><h2>${t('vision')}</h2><p>${escape(f(s,'vision'))}</p></section><section><h2>${t('mission')}</h2><p>${escape(f(s,'mission'))}</p></section></div></details>`}
function axis(s,index){return `<p class="screen-kicker">${t('allAxes')} · ${index-1} / 6</p><h1>${escape(f(s,'title'))}</h1><p class="lead">${escape(f(s,'lead'))}</p><div class="axis-layout"><div class="axis-symbol"><span class="axis-number">${String(index-1).padStart(2,'0')}</span>${icon(axisIcons[index-2])}</div><div class="axis-content">${bullets(s)}<div class="axis-value"><strong>${t('outcome')}:</strong> ${escape(T[state.lang].axisCaptions[index-2])}</div></div></div>`}
function feedback(s){const examples=s.role_contributions||[];return `<p class="screen-kicker">${t('feedbackNav')}</p><h1>${escape(f(s,'title'))}</h1><p class="lead">${escape(f(s,'lead'))}</p><div class="feedback-intro"><div>${bullets(s)}</div><div class="cta-box"><h2>${t('feedbackTitle')}</h2><p>${t('feedbackText')}</p><a class="survey-link" id="survey-link" href="https://forms.gle/7hL3bUsMV7K3ZdPD7" target="_blank" rel="noopener noreferrer">${t('survey')}${icon('external')}</a></div></div><h2 class="role-heading">${t('roleHeading')}</h2><div class="roles-grid">${examples.map(e=>{const role=DATA.roles.find(r=>r.id===e.role_id);return `<section class="role-item"><h3>${escape(f(role,'label'))}</h3><p>${escape(f(e,'example'))}</p></section>`}).join('')}</div>`}
function render(){document.documentElement.lang=state.lang;document.documentElement.dir=state.lang==='ar'?'rtl':'ltr';document.title=state.lang==='ar'?'الخطة الاستراتيجية 2026–2030 · شاركنا رأيك':'Strategic plan 2026–2030 · Share your feedback';$$('[data-label]').forEach(e=>e.textContent=t(e.dataset.label));$('.skip').textContent=t('skip');$('.brand img').alt=t('faculty');$('#language-button').innerHTML=state.lang==='ar'?'English <small>EN</small>':'العربية <small>ع</small>';$('#language-button').setAttribute('aria-label',state.lang==='ar'?'Switch to English':'التبديل إلى العربية');$('#menu-button').setAttribute('aria-label',t('menuLabel'));$('#print-button').setAttribute('aria-label',t('printLabel'));$('#nav-list').setAttribute('aria-label',t('contents'));$('#screen-progress').setAttribute('aria-label',t('contents'));$('#nav-list').innerHTML=DATA.screens.map((s,i)=>`<button class="nav-item ${i===state.index?'active':''}" data-index="${i}" ${i===state.index?'aria-current="page"':''}><span class="nav-num">${String(i+1).padStart(2,'0')}</span><span>${escape(navTitle(i))}</span></button>`).join('');$('#screens').innerHTML=DATA.screens.map((s,i)=>`<section class="screen" id="${s.id}" tabindex="-1" aria-label="${escape(f(s,'title'))}" ${i!==state.index?'hidden':''}>${printHead()}${i===0?cover(s):i===1?identity(s):i===8?feedback(s):axis(s,i)}${printFoot(i)}</section>`).join('');$('#page-count').textContent=t('page')+' '+(state.index+1)+' '+t('of')+' 9';$('#screen-progress').innerHTML=DATA.screens.map((s,i)=>`<button data-index="${i}" class="${state.index===i?'active':''}" aria-label="${t('page')} ${i+1}: ${escape(navTitle(i))}" ${i===state.index?'aria-current="page"':''}></button>`).join('');$('#previous').innerHTML=icon('back','arrow')+t('previous');$('#previous').disabled=state.index===0;$('#next').innerHTML=(state.index===8?t('restart'):t('next'))+icon('arrow','arrow');}
function closeMenu(){document.body.classList.remove('nav-open');$('#menu-button').setAttribute('aria-expanded','false')}
function navigate(index,{focus=false}={}){state.index=Math.max(0,Math.min(8,Number(index)||0));closeMenu();render();try{history.replaceState(null,'','#'+DATA.screens[state.index].id)}catch{}window.scrollTo?.({top:0,behavior:'instant'});if(focus)$('#'+DATA.screens[state.index].id)?.focus()}
let timer;
function toast(text){$('#toast').textContent=text;$('#toast').classList.add('show');clearTimeout(timer);timer=setTimeout(()=>$('#toast').classList.remove('show'),4000)}
document.addEventListener('click',event=>{const el=event.target.closest('button,a');if(!el)return;if(el.dataset.index!==undefined)navigate(Number(el.dataset.index),{focus:true});if(el.id==='survey-link'){let valid=false;try{valid=new URL(el.getAttribute('href')).protocol==='https:'}catch{}if(!valid){event.preventDefault();toast(t('notReady'))}}});
$('#language-button').addEventListener('click',()=>{state.lang=state.lang==='ar'?'en':'ar';closeMenu();render();$('#language-button').focus()});$('#previous').addEventListener('click',()=>navigate(state.index-1,{focus:true}));$('#next').addEventListener('click',()=>navigate(state.index===8?0:state.index+1,{focus:true}));$('#menu-button').addEventListener('click',()=>{const open=document.body.classList.toggle('nav-open');$('#menu-button').setAttribute('aria-expanded',String(open));if(open)$('#nav-list .nav-item.active')?.focus()});$('#nav-backdrop').addEventListener('click',closeMenu);$('#print-button').addEventListener('click',()=>window.print());
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeMenu();return}if(/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)||e.target.isContentEditable||e.ctrlKey||e.altKey||e.metaKey)return;if(['PageDown',state.lang==='ar'?'ArrowLeft':'ArrowRight'].includes(e.key)){e.preventDefault();navigate(state.index+1,{focus:true})}if(['PageUp',state.lang==='ar'?'ArrowRight':'ArrowLeft'].includes(e.key)){e.preventDefault();navigate(state.index-1,{focus:true})}if(e.key==='Home'){e.preventDefault();navigate(0,{focus:true})}if(e.key==='End'){e.preventDefault();navigate(8,{focus:true})}});
let printDetails=[];window.addEventListener('beforeprint',()=>{printDetails=$$('details').map(e=>[e,e.open]);printDetails.forEach(([e])=>e.open=true)});window.addEventListener('afterprint',()=>printDetails.forEach(([e,open])=>e.open=open));
window.addEventListener('hashchange',()=>{const i=DATA.screens.findIndex(s=>s.id===location.hash.slice(1));if(i>=0&&i!==state.index)navigate(i)});
render();
})();
</script>
