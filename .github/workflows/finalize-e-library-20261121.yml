name: Finalize e-library publication 2026-11-21
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/finalize-e-library-20261121.yml"
      - "e-library-v3/data/_publish-catalog-20261121.csv"
      - "e-library-v3/data/_publish-papers-20261121.csv"
      - "e-library-v3/data/_publish-report-20261121.html"
permissions:
  contents: write
jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct complete catalogue files
        shell: bash
        run: |
          set -euo pipefail
          git show e6f832d3a1ccd763f02f383fcb0edae49934aebe:e-library-v3/data/catalog.csv > e-library-v3/data/catalog.csv
          cat e-library-v3/data/_publish-catalog-20261121.csv >> e-library-v3/data/catalog.csv
          git show e6f832d3a1ccd763f02f383fcb0edae49934aebe:e-library-v3/data/research-papers.csv > e-library-v3/data/research-papers.csv
          cat e-library-v3/data/_publish-papers-20261121.csv >> e-library-v3/data/research-papers.csv
          python - <<'PY'
          from pathlib import Path
          import subprocess
          old = subprocess.check_output([
              "git", "show",
              "e6f832d3a1ccd763f02f383fcb0edae49934aebe:e-library-v3/data/source-report.html"
          ], text=True)
          fragment = Path("e-library-v3/data/_publish-report-20261121.html").read_text()
          if "<main>" not in old:
              raise SystemExit("source report main marker missing")
          Path("e-library-v3/data/source-report.html").write_text(
              old.replace("<main>", "<main>" + fragment, 1)
          )
          PY
          git rm e-library-v3/data/_publish-catalog-20261121.csv
          git rm e-library-v3/data/_publish-papers-20261121.csv
          git rm e-library-v3/data/_publish-report-20261121.html
          git rm .github/workflows/finalize-e-library-20261121.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add e-library-v3/data/catalog.csv e-library-v3/data/research-papers.csv e-library-v3/data/source-report.html
          git commit -m "Finalize complete e-library data files for 21 Nov"
          git push
