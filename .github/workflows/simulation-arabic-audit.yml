name: Simulation Arabic source audit
on:
  push:
    branches: ['arabic-simulations-review-20261005']
    paths: ['.github/workflows/simulation-arabic-audit.yml']
permissions:
  contents: read
jobs:
  source-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arabic-simulations-review-20261005
      - name: Archive current repository sources for language review
        run: git archive --format=zip HEAD -o /tmp/simulation-source-review.zip
      - uses: actions/upload-artifact@v4
        with:
          name: simulation-source-review
          path: /tmp/simulation-source-review.zip
          retention-days: 2
