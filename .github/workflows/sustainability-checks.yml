name: Sustainability module checks
on:
  push:
    paths:
      - 'quality-system-prototype/sustainability/**'
      - 'quality-system-prototype/sustainability-link.js'
      - '.github/workflows/sustainability-checks.yml'
      - '.github/sustainability-browser.cjs'
      - '.github/sustainability-cdp.cjs'
      - '.github/department-continuity-browser.cjs'
  pull_request:
    paths:
      - 'quality-system-prototype/sustainability/**'
      - 'quality-system-prototype/sustainability-link.js'
      - '.github/sustainability-browser.cjs'
      - '.github/sustainability-cdp.cjs'
      - '.github/department-continuity-browser.cjs'
permissions:
  contents: read
jobs:
  rule-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Validate JavaScript syntax
        run: |
          node --check quality-system-prototype/sustainability/core.js
          node --check quality-system-prototype/sustainability/ui.js
          node --check quality-system-prototype/sustainability-link.js
          node --check quality-system-prototype/sustainability/departments-data.js
          node --check quality-system-prototype/sustainability/departments-app.js
          node --check .github/sustainability-browser.cjs
          node --check .github/sustainability-cdp.cjs
          node --check .github/department-continuity-browser.cjs
      - name: Verify evidence gates and continuity rules
        run: node --test quality-system-prototype/sustainability/core.test.cjs
      - name: Verify local browser workflow with synthetic files
        run: node .github/sustainability-cdp.cjs
      - name: Verify concise department form in real browser
        run: |
          sed -e 's/sustainability-browser.cjs/department-continuity-browser.cjs/g' -e 's/sustainability-browser.json/department-continuity-browser.json/g' .github/sustainability-cdp.cjs > .github/department-continuity-cdp.tmp.cjs
          node .github/department-continuity-cdp.tmp.cjs
