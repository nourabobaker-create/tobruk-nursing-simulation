name: Simulation language regression checks
on:
  push:
    branches: [main]
    paths:
      - 'clinical-simulations/**'
      - 'simulation-language-review/**'
      - 'nursing-skills/**'
      - 'handwash-learning-03/**'
      - '*-learning-01/**'
      - 'portal-metrics/**'
      - '.github/workflows/simulation-language-checks.yml'
  pull_request:
    paths:
      - 'clinical-simulations/**'
      - 'simulation-language-review/**'
      - 'nursing-skills/**'
      - 'handwash-learning-03/**'
      - '*-learning-01/**'
      - 'portal-metrics/**'
      - '.github/workflows/simulation-language-checks.yml'
permissions:
  contents: read
jobs:
  arabic-ui:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify locale packaging and clinical-source provenance
        run: |
          python simulation-language-review/rebuild_locales.py
          git diff --exit-code -- clinical-simulations
      - name: Validate the 100-topic authored corpus and both adaptive routes
        run: |
          python clinical-simulations/scenarios/build.py --check
          node --check clinical-simulations/scenarios/app.js
          node clinical-simulations/scenarios/tests/engine.cjs
      - name: Verify optional metrics, aggregation and simulation activity boundaries
        run: node --test portal-metrics/tests/*.test.cjs
      - name: Install the scenario browser test runner outside the site
        run: npm install --prefix /tmp/scenario-browser playwright
      - name: Exercise both challenge routes for all 100 topics in Chromium
        run: |
          PLAYWRIGHT_MODULE=/tmp/scenario-browser/node_modules/playwright CHROME_BIN="$(command -v google-chrome)" node clinical-simulations/scenarios/tests/browser.cjs
      - name: Verify rendered simulation metrics, loader rebinding and visible completion in Chromium
        run: |
          PLAYWRIGHT_MODULE=/tmp/scenario-browser/node_modules/playwright CHROME_BIN="$(command -v google-chrome)" node portal-metrics/tests/activities.browser.cjs
      - name: Verify connected-empty dashboard, read errors and mobile layout in Chromium
        run: |
          PLAYWRIGHT_MODULE=/tmp/scenario-browser/node_modules/playwright CHROME_BIN="$(command -v google-chrome)" DASHBOARD_SCREENSHOT_DIR=/tmp/tobruk-metrics-dashboard node portal-metrics/tests/dashboard.browser.cjs
      - run: python -m pip install playwright --quiet
      - name: Verify the 17 active simulations and language persistence
        run: python simulation-language-review/verify_browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulation-language-results
          path: |
            /tmp/tobruk-language-qa
            /tmp/clinical-100-*.png
            /tmp/tobruk-metrics-consent
            /tmp/tobruk-metrics-dashboard
          retention-days: 7
