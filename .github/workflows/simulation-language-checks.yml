name: Simulation language regression checks
on:
  push:
    branches: [main]
    paths:
      - 'clinical-simulations/**'
      - 'simulation-language-review/**'
      - 'nursing-skills/**'
      - 'handwash-learning-03/**'
      - '*-learning-01/**'
      - '.github/workflows/simulation-language-checks.yml'
  pull_request:
    paths:
      - 'clinical-simulations/**'
      - 'simulation-language-review/**'
      - 'nursing-skills/**'
      - 'handwash-learning-03/**'
      - '*-learning-01/**'
      - '.github/workflows/simulation-language-checks.yml'
permissions:
  contents: read
jobs:
  arabic-ui:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify locale packaging and clinical-source provenance
        run: |
          python simulation-language-review/rebuild_locales.py
          git diff --exit-code -- clinical-simulations
      - run: python -m pip install playwright --quiet
      - name: Verify the 17 active simulations and language persistence
        run: python simulation-language-review/verify_browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulation-language-results
          path: /tmp/tobruk-language-qa
          retention-days: 7
