name: Apply and test reviewed simulation Arabic
on:
  push:
    branches: ['arabic-simulations-review-20261005']
    paths: ['.github/workflows/apply-arabic-review.yml']
permissions:
  contents: write
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arabic-simulations-review-20261005
      - name: Verify the exact reviewed display polish
        run: |
          python - <<'PY'
          import hashlib,pathlib,urllib.request,zipfile
          url='https://drive.usercontent.google.com/download?id=1zGiwjBqC2SKYkH_VOesERN-SiYTIFjcI&export=download&confirm=t'
          data=urllib.request.urlopen(url,timeout=90).read(5000000)
          assert hashlib.sha256(data).hexdigest()=='b1c5c489eecef14885303e05ae45bf47ec054d28ef24a7654cac5ec45e72daac'
          p=pathlib.Path('/tmp/arabic-polish.zip');p.write_bytes(data)
          dest=pathlib.Path('/tmp/arabic-polish');dest.mkdir()
          with zipfile.ZipFile(p) as z:
              assert sum(i.file_size for i in z.infolist())<15000000
              for i in z.infolist():
                  a=pathlib.PurePosixPath(i.filename)
                  assert not a.is_absolute() and '..' not in a.parts
                  assert i.filename in ('apply.py','manifest.json') or i.filename.startswith('files/')
                  assert (i.external_attr>>16)&0o170000!=0o120000
              z.extractall(dest)
          PY
      - name: Apply scoped display-only refinements
        run: python /tmp/arabic-polish/apply.py "$GITHUB_WORKSPACE"
      - name: Save refined candidate on review branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Polish Arabic headings and complete source translations; preserve clinical label IDs'
          git push origin HEAD:arabic-simulations-review-20261005
      - run: python -m pip install playwright --quiet
      - name: Verify 17 real routes, clinical label IDs, and language preference
        run: python simulation-language-review/verify_browser.py
      - name: Preserve successful executed report
        run: |
          cp /tmp/tobruk-language-qa/report.json simulation-language-review/verified-browser-results.json
          git add simulation-language-review/verified-browser-results.json
          git commit -m 'Record successful real-route Arabic browser checks'
          git push origin HEAD:arabic-simulations-review-20261005
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arabic-review-browser-results
          path: /tmp/tobruk-language-qa
          retention-days: 3
