name: Import verified clinical simulation release
on:
  push:
    branches: ['portal-clinical-simulations-20261005']
    paths: ['.github/workflows/import-clinical-simulations.yml']
permissions:
  contents: write
jobs:
  import-release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: portal-clinical-simulations-20261005
      - name: Download and verify the user-authorized public teaching files
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, pathlib, urllib.request, zipfile
          url='https://drive.usercontent.google.com/download?id=1RFr_Snlje75IzATfiJ0m0b02Io07Qnej&export=download&confirm=t'
          expected='3535109746c1050856b377f5defdcb3151cfd2bff80a6c36b0b87d5f5d5510a6'
          data=urllib.request.urlopen(url, timeout=90).read(5000000)
          assert hashlib.sha256(data).hexdigest()==expected, 'Archive checksum mismatch; no repository files changed'
          archive=pathlib.Path('/tmp/tobruk-clinical-release.zip');archive.write_bytes(data)
          dest=pathlib.Path('/tmp/tobruk-clinical-release');dest.mkdir(exist_ok=True)
          with zipfile.ZipFile(archive) as z:
              assert sum(i.file_size for i in z.infolist())<10000000
              for info in z.infolist():
                  p=pathlib.PurePosixPath(info.filename)
                  assert not p.is_absolute() and '..' not in p.parts
                  assert info.filename=='apply-release.py' or info.filename.startswith('clinical-simulations/')
                  assert (info.external_attr >> 16) & 0o170000 != 0o120000
              z.extractall(dest)
          print('Verified exact release archive:', len(data), 'bytes')
          PY
      - name: Apply only the catalogue and scoped navigation changes
        run: python /tmp/tobruk-clinical-release/apply-release.py "$GITHUB_WORKSPACE"
      - name: Check original module hashes and JavaScript syntax
        run: |
          python - <<'PY'
          import hashlib,json,pathlib,subprocess
          from html.parser import HTMLParser
          root=pathlib.Path('clinical-simulations');m=json.loads((root/'manifest.json').read_text())
          assert len(m['modules'])==10
          class Scripts(HTMLParser):
              def __init__(self):super().__init__();self.active=False;self.parts=[];self.scripts=[]
              def handle_starttag(self,tag,attrs):
                  if tag=='script':
                      a=dict(attrs);self.active=not a.get('src') and a.get('type','') not in ('application/json','application/ld+json');self.parts=[]
              def handle_data(self,data):
                  if self.active:self.parts.append(data)
              def handle_endtag(self,tag):
                  if tag=='script' and self.active:self.scripts.append(''.join(self.parts));self.active=False
          for item in m['modules']:
              data=(root/item['url']).read_bytes()
              assert hashlib.sha256(data).hexdigest()==item['sha256'],item['id']
              p=Scripts();p.feed(data.decode('utf-8'))
              for s in p.scripts:subprocess.run(['node','--check'],input=s,text=True,check=True)
              print(item['id'],len(data),'bytes: original hash and syntax verified')
          for name in ['library.js','portal-link.js']:subprocess.run(['node','--check',str(root/name)],check=True)
          PY
      - name: Save the verified release on the staging branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add clinical-simulations index.html student-learning-hub/index.html nursing-skills/index.html
          git commit -m 'Add ten original clinical simulations and bilingual portal catalogue'
          git push origin HEAD:portal-clinical-simulations-20261005
