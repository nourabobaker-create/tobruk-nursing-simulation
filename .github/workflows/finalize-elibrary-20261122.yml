name: Finalize e-library update 2026-11-22
on:
  push:
    branches: [main]
    paths:
      - '.github/elibrary-20261122/**'
      - '.github/workflows/finalize-elibrary-20261122.yml'
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore and validate library files
        shell: bash
        run: |
          set -euo pipefail
          cat .github/elibrary-20261122/package.b64.part-* | base64 -d > /tmp/elibrary-20261122.tgz
          tar -xzf /tmp/elibrary-20261122.tgz -C .
          rm .github/elibrary-20261122/package.b64.part-*
          rmdir .github/elibrary-20261122
          rm .github/workflows/finalize-elibrary-20261122.yml
          node --check e-library-v3/data/resources-30.js
          python - <<'PY'
          import csv, json
          from pathlib import Path
          p=Path("e-library-v3/data")
          with (p/"catalog.csv").open(encoding="utf-8-sig", newline="") as f:
              rows=list(csv.DictReader(f))
          assert len(rows)==3326, len(rows)
          assert len({r["id"] for r in rows})==3326
          assert len({r["read_url"] for r in rows})==3326
          with (p/"research-papers.csv").open(encoding="utf-8-sig", newline="") as f:
              papers=list(csv.DictReader(f))
          assert len(papers)==311, len(papers)
          assert len({r["id"] for r in papers})==311
          log=json.loads((p/"research-log-20261122.json").read_text(encoding="utf-8"))
          assert len(log["selected_resources"])==40
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add e-library-v3 .github
          git commit -m "Expand nursing e-library with 40 verified sources (22 Nov)"
          git push origin main
